# Build Android APK on every push to main, publish an ordered semver tag
# (0.0.1 → 0.0.2 → 0.0.3 …), keep apk-latest rolling, and refresh website meta.
# See APK_RELEASE_PIPELINE.md for the full story.

name: Build APK & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build & publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Compute next ordered version tag
        id: ver
        run: |
          set -e
          # Only pure semver tags count for order (ignore apk-latest / apk-N-sha)
          TAGS=$(git tag -l | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true)
          export TAGS
          NEXT=$(node -e '
            const tags = (process.env.TAGS || "").split(/\n/).filter(Boolean);
            let best = null;
            const parse = (s) => {
              const m = String(s).replace(/^v/i, "").match(/^(\d+)\.(\d+)\.(\d+)/);
              return m ? [+m[1], +m[2], +m[3]] : null;
            };
            const cmp = (a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
            for (const t of tags) {
              const p = parse(t);
              if (!p) continue;
              if (!best || cmp(p, best) > 0) best = p;
            }
            if (!best) {
              console.log("0.0.1");
              process.exit(0);
            }
            console.log(best[0] + "." + best[1] + "." + (best[2] + 1));
          ')
          echo "Existing ordered tags:"
          echo "$TAGS" | sort -V || true
          echo "Next ordered tag: $NEXT"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Build web + Capacitor sync
        env:
          VITE_APP_BUILD: ${{ github.run_number }}
          VITE_APP_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          echo "Building as ordered tag ${{ steps.ver.outputs.version }} (build ${{ github.run_number }})"
          npm run build
          npx cap sync android

      - name: Decode release keystore (if provided)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No ANDROID_KEYSTORE_BASE64 secret — building debug APK."
          fi

      - name: Configure release signing from secrets
        if: steps.keystore.outputs.present == 'true'
        env:
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          {
            echo "RELEASE_STORE_FILE=release.keystore"
            echo "RELEASE_STORE_PASSWORD=${STORE_PASS}"
            echo "RELEASE_KEY_ALIAS=${KEY_ALIAS}"
            echo "RELEASE_KEY_PASSWORD=${KEY_PASS}"
          } >> android/gradle.properties

      - name: Sync Android version with ordered tag + run number
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"${{ steps.ver.outputs.version }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle | head -5

      - name: Assemble release APK
        if: steps.keystore.outputs.present == 'true'
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Assemble debug APK (fallback)
        if: steps.keystore.outputs.present != 'true'
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Stage APK + version metadata
        id: stage
        run: |
          set -e
          RELEASE_APK="android/app/build/outputs/apk/release/app-release.apk"
          DEBUG_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$RELEASE_APK" ]; then
            SRC="$RELEASE_APK"
            KIND=release
          elif [ -f "$DEBUG_APK" ]; then
            SRC="$DEBUG_APK"
            KIND=debug
          else
            echo "No APK found under android/app/build/outputs/apk/"
            find android/app/build/outputs -type f -name '*.apk' || true
            exit 1
          fi
          mkdir -p public
          cp "$SRC" public/icalc.apk
          cp "$SRC" icalc.apk
          ls -lh public/icalc.apk

          export VERSION="${{ steps.ver.outputs.version }}"
          export BUILD="${{ github.run_number }}"
          export SHA="${{ github.sha }}"
          export STABLE_URL="https://github.com/${{ github.repository }}/releases/download/apk-latest/icalc.apk"
          export TAG_URL="https://github.com/${{ github.repository }}/releases/download/${VERSION}/icalc.apk"
          export PUBLISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          node -e "
            const j = {
              version: process.env.VERSION,
              build: Number(process.env.BUILD),
              sha: process.env.SHA,
              apkUrl: process.env.TAG_URL,
              stableApkUrl: process.env.STABLE_URL,
              publishedAt: process.env.PUBLISHED_AT,
            };
            const fs = require('fs');
            const body = JSON.stringify(j, null, 2) + '\n';
            fs.writeFileSync('version.json', body);
            fs.writeFileSync('public/app-release.json', body);
            console.log(body);
          "
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"

      - name: Create ordered version release (0.0.x)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: Release ${{ steps.ver.outputs.version }}
          body: |
            Ordered release **${{ steps.ver.outputs.version }}** from `${{ github.sha }}` on `${{ github.ref_name }}`.

            - Build type: **${{ steps.stage.outputs.kind }}**
            - CI run: **#${{ github.run_number }}**
            - Download (this tag):  
              https://github.com/${{ github.repository }}/releases/download/${{ steps.ver.outputs.version }}/icalc.apk
            - Stable rolling link:  
              https://github.com/${{ github.repository }}/releases/download/apk-latest/icalc.apk
          files: |
            icalc.apk
            version.json
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: false

      - name: Update rolling apk-latest tag + release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Latest APK (${{ steps.ver.outputs.version }})
          body: |
            Rolling release — always the newest CI APK from `main`.

            **Ordered version:** ${{ steps.ver.outputs.version }}  
            **Download:** [icalc.apk](https://github.com/${{ github.repository }}/releases/download/apk-latest/icalc.apk)

            Built from `${{ github.sha }}` (run #${{ github.run_number }}, ${{ steps.stage.outputs.kind }}).
          files: |
            icalc.apk
            version.json
          fail_on_unmatched_files: true
          make_latest: true

      - name: Commit release metadata (+ optional APK) for Vercel website
        env:
          COMMIT_APK: ${{ secrets.COMMIT_APK_TO_REPO }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app-release.json
          if [ "$COMMIT_APK" = "true" ]; then
            git add -f public/icalc.apk
          fi
          if git diff --staged --quiet; then
            echo "No metadata/APK changes; skip commit."
            exit 0
          fi
          git commit -m "chore: release ${{ steps.ver.outputs.version }} metadata [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
